<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title">
<title id="title">TaskForge: AI-first ticketing. The Coder agent opens PRs and fixes them from its own CI logs. Built with Next.js 15, Prisma, Postgres, MCP.</title>
