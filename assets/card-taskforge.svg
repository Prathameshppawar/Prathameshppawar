amily="Sub, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#1C1917" text-anchor="middle" >MCP</text><text x="128.4" y="304.0" font-family="Hand, 'Comic Sans MS', 'Segoe Print', cursive" font-size="23" fill="#A7342A" transform="rotate(-2 128.416 304)">agents can't delete stuff. on purpose.</text><path d="M200.0,-17.0 H320.0 l-5,8.5 5,8.5 -5,8.5 5,8.5 H200.0 l5,-8.5 -5,-8.5 5,-8.5 -5,-8.5 Z" fill="#FFFFFF" fill-opacity=".6" stroke="#1C1917" stroke-opacity=".06" transform="rotate(-1.8 260.0 0)"/></g>
